<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NERIVO — Risorse</title><meta name="description" content="Guide NERIVO per agenzie immobiliari."><link rel="stylesheet" href="/styles.css"></head><body><main style="max-width:900px;margin:0 auto;padding:64px 24px"><p><a href="/">NERIVO</a></p><h1>Risorse</h1><p>Guide pratiche su lead, follow-up e automazione.</p><div id="posts">Caricamento…</div></main><script>fetch("/content/index.json").then(r=>r.json()).then(posts=>{document.querySelector("#posts").innerHTML=posts.map(p=>'<article style="padding:24px 0;border-top:1px solid #333"><h2><a href="/content/posts/'+encodeURIComponent(p.slug)+'.html">'+p.title+'</a></h2><p>'+p.summary+'</p><small>'+p.date+'</small></article>').join("")}).catch(()=>document.querySelector("#posts").textContent="Nessuna risorsa disponibile.");</script></body></html>
